<html lang="pt-BR">
<head>

    <style>
        /* ================= ESTILOS GERAIS ================= */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #121212; 
            color: #ffffff; 
            margin: 0; 
            min-height: 100vh;
        }

        /* ================= ESTRUTURA DE TELAS ================= */
        .screen { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .center { justify-content: center; }

        #inicio, #tela-premios { display: none; justify-content: flex-start; min-height: 100vh; }
        #entrada { min-height: 100vh; }

        /* ================= LOGIN BOX ================= */
        .login-box {
            background: #1e1e1e; padding: 40px; border-radius: 12px;
            border: 1px solid #FFD700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            text-align: center; max-width: 400px; width: 100%;
        }
        .login-box h2 { color: #FFD700; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-size: 1.8rem; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #2a2a2a; color: #fff; border: 1px solid #FFD700; font-size: 1.2rem; text-align: center; outline: none; }
        .login-box button { width: 100%; background: #FFD700; color: #121212; border: none; padding: 15px; font-size: 1.2rem; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease; }
        .login-box button:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6); }
        .erro-senha { color: #ef4444; margin-top: 15px; font-weight: bold; display: none; }

        /* ================= COMPONENTES DOS SORTEIOS ================= */
        h1 { color: #FFD700; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); margin-bottom: 30px; text-align: center; }

        .painel-controles { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #FFD700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); width: 100%; max-width: 600px; margin-bottom: 30px; }
        .select-principal { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; background: #2a2a2a; color: #fff; border: 1px solid #FFD700; font-size: 1.1rem; cursor: pointer; outline: none; }
        
        .linha-acao { display: flex; justify-content: space-between; align-items: center; gap: 15px; position: relative; z-index: 10; }
        
        .bloco-icone { position: relative; display: flex; flex-direction: column; align-items: center; }
        .btn-icone { background: transparent; border: none; font-size: 2.5rem; cursor: pointer; transition: transform 0.2s; }
        .btn-icone:hover { transform: scale(1.1); }

        /* Classes Blindadas e Independentes para os Botões de Prêmios */
        .bloco-icone-premio { position: relative; display: flex; flex-direction: column; align-items: center; z-index: 50; }
        .btn-icone-premio { background: transparent; border: none; font-size: 2.5rem; cursor: pointer; transition: transform 0.2s; z-index: 60; position: relative; padding: 5px; }
        .btn-icone-premio:hover { transform: scale(1.15); }

        .select-flutuante { display: none; position: absolute; top: 100%; margin-top: 10px; background: #2a2a2a; color: #fff; border: 1px solid #FFD700; padding: 8px; border-radius: 5px; z-index: 30; font-size: 0.9rem; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .select-flutuante.ativo { display: block; }
        
        button.btn-sortear-geral { background: #FFD700; color: #121212; border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); flex-grow: 1; }
        button.btn-sortear-geral:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6); }
        button.btn-sortear-geral:disabled { background: #444; color: #777; cursor: not-allowed; box-shadow: none; border: 1px solid #555; }

        .grid-numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 15px; width: 100%; max-width: 900px; margin-bottom: 40px; justify-content: center; }
        .numero-box { background: #222; border: 2px solid #333; border-radius: 10px; padding: 20px 0; font-size: 1.8rem; font-weight: bold; text-align: center; transition: all 0.1s ease; position: relative; }
        
        /* Cores do Sorteio Principal */
        .numero-box.cursor { background: #FFD700; color: #121212; border-color: #fff; transform: scale(1.2); box-shadow: 0 0 20px #FFD700; z-index: 10; }
        .numero-box.sorteado { opacity: 0.3; background: #111; border-color: #222; text-decoration: line-through; color: #666; pointer-events: none; }
        .numero-box.vencedor { background: #22c55e; color: #fff; border-color: #fff; box-shadow: 0 0 30px #22c55e; animation: pulsoVerde 1s infinite alternate; z-index: 5; opacity: 1; text-decoration: none; }

        /* Cores Específicas do Sorteio de Prêmios */
        .numero-box-premio { background: #222; border: 2px solid #333; border-radius: 10px; padding: 20px 0; font-size: 1.8rem; font-weight: bold; text-align: center; transition: all 0.1s ease; position: relative; }
        .numero-box-premio.cursor { background: #FFD700; color: #121212; border-color: #fff; transform: scale(1.2); box-shadow: 0 0 30px #FFD700, 0 0 50px #FF8C00; z-index: 10; }
        .numero-box-premio.sorteado { opacity: 0.3; background: #111; border-color: #222; text-decoration: line-through; color: #666; pointer-events: none; }
        .numero-box-premio.vencedor { background: #FFD700; color: #121212; border-color: #fff; box-shadow: 0 0 30px #FFD700, 0 0 60px #FF8C00; animation: pulsoDouradoPremio 1s infinite alternate; z-index: 5; opacity: 1; text-decoration: none; }
        
        /* Destaque para prêmios dourados na grade */
        .numero-box-premio.dourado { background: #FFCC00; color: #121212; border: 2px solid #fff; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
        .numero-box-premio.dourado.sorteado { background: #3a3200; color: #666; border-color: #222; box-shadow: none; opacity: 0.3; }
        .numero-box-premio.dourado.cursor { background: #fff; color: #121212; border-color: #FFD700; box-shadow: 0 0 30px #FFD700, 0 0 50px #FFF; z-index: 10; }

        @keyframes pulsoVerde { from { transform: scale(1); box-shadow: 0 0 20px #22c55e; } to { transform: scale(1.15); box-shadow: 0 0 40px #22c55e, 0 0 60px #22c55e; } }
        @keyframes pulsoDouradoPremio { from { transform: scale(1); box-shadow: 0 0 20px #FFD700; } to { transform: scale(1.15); box-shadow: 0 0 40px #FFD700, 0 0 60px #FF8C00; } }

        /* ================= TELAS DE RESULTADOS ================= */
        .area-resultado {
            display: none; background: linear-gradient(145deg, #1a1a1a, #222); border: 2px solid #FFD700;
            border-radius: 15px; padding: 40px 30px; width: 100%; max-width: 600px; text-align: center;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15); margin-bottom: 50px;
        }

        .titulo-vaga { font-size: 2.8rem; font-weight: 900; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 3px; }
        .titulo-adm { color: #3b82f6; text-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
        .titulo-leit { color: #f59e0b; text-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }

        .dados-container { text-align: left; background: rgba(0,0,0,0.4); padding: 25px; border-radius: 10px; border-left: 6px solid #FFD700; line-height: 1.8; font-size: 1.3rem; margin-top: 30px;}
        .dados-container span.label { color: #FFD700; font-weight: bold; display: inline-block; width: 130px; }

        /* Holofote Base */
        .efeito-holofote {
            color: #FFF;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 40px #FF8C00;
            animation: brilhoHolofote 2s infinite alternate;
            font-weight: bold;
            transform: scale(1.05);
            transition: all 0.5s ease;
        }
        @keyframes brilhoHolofote {
            0% { text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 40px #FF8C00; }
            25% { text-shadow: 0 0 20px #FFF, 0 0 30px #FFD700, 0 0 60px #FF8C00, 0 0 90px #FFD700; }
        }

        /* Troféu Gigante Animado & Efeito Champanhe */
        .champanhe-wrapper { position: relative; display: inline-block; cursor: pointer; }
        .champanhe-wrapper:hover { transform: scale(1.1); transition: 0.3s; }
        .trofeu-gigante { font-size: 6rem; display: inline-block; animation: pulsarTrofeu 1.5s ease-in-out infinite alternate; }
        @keyframes pulsarTrofeu { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-10px) scale(1.1); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)); } }
        
        .champanhe-colocacao {
            position: absolute; top: 50%; left: 50%; transform: translateX(-50%);
            color: #FFD700; font-size: 1.8rem; font-weight: bold;
            text-shadow: 0 0 8px #FFF, 0 0 15px #FFD700, 0 0 25px #FF8C00;
            opacity: 0; animation: escorrerChampanhe 3.5s infinite; pointer-events: none; white-space: nowrap;
        }
        @keyframes escorrerChampanhe {
            0% { top: 50%; opacity: 1; filter: blur(0px); transform: translateX(-50%) scale(1); }
            70% { opacity: 0.9; transform: translateX(-50%) scale(0.95); }
            100% { top: 120%; opacity: 0; filter: blur(3px); transform: translateX(-50%) scale(0.8); }
        }
        .clique-aqui-trofeu { font-size: 0.9rem; color: #FFD700; font-weight: bold; margin-top: 15px; animation: piscarC 1.5s infinite; }
        @keyframes piscarC { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ================= TELA DE PRÊMIOS ================= */
        .premio-revelado { display: none; margin-top: 30px; }
        .premio-topo { font-size: 1.5rem; color: #aaa; margin-bottom: 10px; letter-spacing: 2px; }
        .premio-frase { font-size: 2rem; margin-bottom: 25px; }
        
        .premio-comum { font-size: 2.5rem; font-weight: bold; color: #3b82f6; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); padding: 20px; background: rgba(0,0,0,0.4); border-radius: 10px; border: 1px solid #3b82f6; }
        .premio-dourado-final { font-size: 3rem; font-weight: 900; color: #FFD700; text-shadow: 0 0 20px #FFD700, 0 0 40px #FF8C00; padding: 25px 20px; background: rgba(0,0,0,0.6); border-radius: 10px; border: 2px solid #FFD700; animation: pulsoDourado 2s infinite alternate; }
        @keyframes pulsoDourado { from { transform: scale(1); box-shadow: 0 0 20px rgba(255,215,0,0.4); } to { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,215,0,0.8); } }

        .btn-voltar { background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 15px; border-radius: 8px; cursor: pointer; margin-top: 40px; font-weight: bold; width: 100%; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-voltar:hover { background: #FFD700; color: #121212; }

        /* ================= MODAL GLOBAL ================= */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-conteudo { background: #1e1e1e; border: 1px solid #FFD700; border-radius: 10px; padding: 30px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); }
        .modal-conteudo h2 { color: #FFD700; margin-top: 0; text-align: center; }
        .hist-item { background: #2a2a2a; padding: 10px; margin-bottom: 10px; border-left: 4px solid #FFD700; border-radius: 4px; }
        .btn-fechar-modal { background: #444; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; display: block; margin: 20px auto 0; font-weight: bold; }
        .btn-fechar-modal:hover { background: #666; }

        @media (max-width: 600px) {
            .titulo-vaga { font-size: 1.6rem; letter-spacing: 1px; }
            .area-resultado { padding: 25px 15px; }
            .dados-container { font-size: 1rem; padding: 15px; }
            .dados-container span.label { width: 90px; }
            button.btn-sortear-geral { padding: 15px 20px; font-size: 1rem; }
            .premio-comum { font-size: 1.5rem; }
            .premio-dourado-final { font-size: 2rem; }
        }
    </style>
</head>

            let hash = 0;
            for (let i = 0; i < texto.length; i++) {
                hash = ((hash << 5) - hash) + texto.charCodeAt(i);
                hash |= 0; 
            }
            return hash;
        }

            { nome: "Fulano Pe4", status: "Leiturista Pedestre", numSorte: "12", cidade: "Sobral", categoria: "pe" },
            { nome: "Beltrano Pe2", status: "Leiturista Pedestre", numSorte: "13", cidade: "Sobral", categoria: "pe" },
            { nome: "Sicrano Pe2", status: "Leiturista Pedestre", numSorte: "14", cidade: "Sobral", categoria: "pe" },

            // Leituristas Rurais
            { nome: "Fulano Ru", status: "Leiturista Rural", numSorte: "15", cidade: "Sobral", categoria: "moto" },
            { nome: "Beltrano Ru", status: "Leiturista Rural", numSorte: "16", cidade: "Sobral", categoria: "moto" },

            { nome: "Beltrano Ru3", status: "Leiturista Rural", numSorte: "20", cidade: "Sobral", categoria: "moto" },
            { nome: "Sicrano Ru2", status: "Leiturista Rural", numSorte: "21", cidade: "Sobral", categoria: "moto" },
            { nome: "Beltrano Ru4", status: "Leiturista Rural", numSorte: "22", cidade: "Sobral", categoria: "moto" },
            { nome: "Fulano Ru3", status: "Leiturista Rural", numSorte: "23", cidade: "Sobral", categoria: "moto" },
            { nome: "Beltrano Ru5", status: "Leiturista Rural", numSorte: "24", cidade: "Sobral", categoria: "moto" },
            { nome: "Sicrano Ru3", status: "Leiturista Rural", numSorte: "25", cidade: "Sobral", categoria: "moto" },
            { nome: "Beltrano Ru6", status: "Leiturista Rural", numSorte: "26", cidade: "Sobral", categoria: "moto" },
            { nome: "Fulano Ru4", status: "Leiturista Rural", numSorte: "27", cidade: "Sobral", categoria: "moto" },
            { nome: "Beltrano Ru7", status: "Leiturista Rural", numSorte: "28", cidade: "Sobral", categoria: "moto" },
            { nome: "Sicrano Ru4", status: "Leiturista Rural", numSorte: "29", cidade: "Sobral", categoria: "moto" },
            { nome: "Beltrano Ru8", status: "Leiturista Rural", numSorte: "30", cidade: "Sobral", categoria: "moto" }
        ];

        let listaAtual = [];
        let intervaloCursor;
        let historicoGlobal = [];

        historicoRef.on('value', (snapshot) => {
            const dados = snapshot.val();
            historicoGlobal = dados ? Object.values(dados) : [];
            if (document.getElementById('listaSelecionada').value !== "") renderizarGrid();
        });

        function getHistorico() { return historicoGlobal; }

        function carregarLista() {
            const selecao = document.getElementById('listaSelecionada').value;
            document.getElementById('result-area').style.display = 'none';

            if (selecao === "Todos") listaAtual = [...bancoColaboradores];
            else if (selecao === "adm") listaAtual = bancoColaboradores.filter(p => p.categoria === "adm");
            else if (selecao === "L-Geral") listaAtual = bancoColaboradores.filter(p => p.categoria === "pe" || p.categoria === "moto");
            else if (selecao === "moto") listaAtual = bancoColaboradores.filter(p => p.categoria === "moto");
            else if (selecao === "pe") listaAtual = bancoColaboradores.filter(p => p.categoria === "pe");
            else listaAtual = [];

            renderizarGrid();
        }

        function renderizarGrid() {
            const grid = document.getElementById('grid-numeros');
            grid.innerHTML = ''; 
            const historico = getHistorico();
            const numerosSorteados = historico.map(h => h.numSorte);

            listaAtual.forEach(pessoa => {
                const div = document.createElement('div');
                div.className = 'numero-box';
                div.id = 'caixa-' + pessoa.numSorte;
                div.innerText = pessoa.numSorte;
                if (numerosSorteados.includes(pessoa.numSorte)) div.classList.add('sorteado');
                grid.appendChild(div);
            });
            avaliarBotaoSortear();
        }

        function avaliarBotaoSortear() {
            const btn = document.getElementById('btn-sortear');
            const historico = getHistorico();
            const numerosSorteados = historico.map(h => h.numSorte);
            const temDisponivel = listaAtual.some(p => !numerosSorteados.includes(p.numSorte));

            if (listaAtual.length === 0 || !temDisponivel) {
                btn.disabled = true;
                if(listaAtual.length > 0) btn.innerText = "Sorteio Finalizado";
            } else {
                btn.disabled = false;
                btn.innerText = "Sortear Agora";
            }
        }

        function iniciarSorteio() {
            const historico = getHistorico();
            const numerosSorteados = historico.map(h => h.numSorte);
            const disponiveis = listaAtual.filter(p => !numerosSorteados.includes(p.numSorte));
            
            if (disponiveis.length === 0) return;

            document.getElementById('btn-sortear').disabled = true;
            document.getElementById('result-area').style.display = 'none';
            document.querySelectorAll('.numero-box').forEach(el => el.classList.remove('vencedor', 'cursor'));

            const audioSus = document.getElementById('audio-tambores');
            audioSus.currentTime = 0;
            audioSus.play();

            let tempoDecorrido = 0;
            const duracaoTotal = 14000; 
            const velocidadePulo = 100;

            intervaloCursor = setInterval(() => {
                document.querySelectorAll('.numero-box').forEach(el => el.classList.remove('cursor'));
                const aleatorioGeral = listaAtual[Math.floor(Math.random() * listaAtual.length)];
                const caixaAtual = document.getElementById('caixa-' + aleatorioGeral.numSorte);
                if (caixaAtual) caixaAtual.classList.add('cursor');

                tempoDecorrido += velocidadePulo;
                if (tempoDecorrido >= duracaoTotal) {
                    clearInterval(intervaloCursor);
                    revelarVencedor(disponiveis);
                }
            }, velocidadePulo);
        }

        function revelarVencedor(disponiveis) {
            document.querySelectorAll('.numero-box').forEach(el => el.classList.remove('cursor'));
            const vencedor = disponiveis[Math.floor(Math.random() * disponiveis.length)];
            
            salvarVencedor(vencedor);

            const caixaVencedora = document.getElementById('caixa-' + vencedor.numSorte);
            if (caixaVencedora) {
                caixaVencedora.classList.add('vencedor');
                setTimeout(() => caixaVencedora.classList.add('sorteado'), 3000); 
            }

            document.getElementById('audio-tambores').pause();
            const audioApla = document.getElementById('audio-aplausos');
            audioApla.currentTime = 0;
            audioApla.play();

            preencherTelaResultado(vencedor);
            avaliarBotaoSortear();
        }

        function salvarVencedor(pessoa) {
            const vencedorEnxuto = {
                nome: pessoa.nome, status: pessoa.status, numSorte: pessoa.numSorte,
                cidade: pessoa.cidade, dataSorteio: new Date().toLocaleString(), categoria: pessoa.categoria
            };
            const total = getHistorico().length + 1;
            const chaveSequencial = (total < 10 ? '0' + total : total) + 'º Sorteado';
            historicoRef.child(chaveSequencial).set(vencedorEnxuto);
        }

        function preencherTelaResultado(pessoa) {
            const area = document.getElementById('result-area');
            const elTitulo = document.getElementById('titulo-vaga');
            const tituloVisor = pessoa.categoria === 'adm' ? 'ADMINISTRATIVO' : 'LEITURISTA';
            
            elTitulo.innerText = tituloVisor;
            elTitulo.className = pessoa.categoria === 'adm' ? 'titulo-vaga titulo-adm' : 'titulo-vaga titulo-leit';

            document.getElementById('res-nome').innerText = pessoa.nome;
            document.getElementById('res-funcao').innerText = pessoa.status;
            document.getElementById('res-num').innerText = pessoa.numSorte;
            document.getElementById('res-cidade').innerText = pessoa.cidade;

            area.style.display = 'block';
            dispararConfetes(tituloVisor);
            setTimeout(() => area.scrollIntoView({ behavior: "smooth", block: "center" }), 300);
        }

        function dispararConfetes(titulo) {
            if (typeof confetti === 'function') {
                let paleta = titulo === 'ADMINISTRATIVO' ? ['#3b82f6', '#60a5fa', '#ffffff'] : ['#FFD700', '#f59e0b', '#ffffff'];
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: paleta, disableForced3d: true });
                setTimeout(() => confetti({ particleCount: 100, spread: 120, origin: { y: 0.5 }, colors: paleta, disableForced3d: true }), 300);
            }
        }

        // ================= FUNÇÕES DE PRÊMIOS =================
        
        function abrirTelaPremios() {
            const statusVencedor = document.getElementById('res-funcao').innerText;
            const nomeVencedor = document.getElementById('res-nome').innerText;
            
            document.getElementById('funcao-vencedor-premio').innerText = statusVencedor;
            document.getElementById('nome-vencedor-premio').innerText = nomeVencedor;

            document.getElementById('inicio').style.display = 'none';
            document.getElementById('tela-premios').style.display = 'flex';
            
            document.getElementById('resultado-premio').style.display = 'none';
            
            renderizarGridPremios();
        }

        function renderizarGridPremios() {
            const grid = document.getElementById('grid-premios');
            grid.innerHTML = '';
            const entregues = getNumerosPremiosSorteados();

            bancoPremiacoes.forEach(premio => {
                const div = document.createElement('div');
                div.className = 'numero-box-premio';
                
                if (premio.relevancia === 'dourado') div.classList.add('dourado');
                
                div.id = 'caixa-premio-' + premio.numPremio;
                div.innerText = premio.numPremio;
                
                if (entregues.includes(premio.numPremio)) {
                    div.classList.add('sorteado');
                }
                grid.appendChild(div);
            });

            avaliarBotaoSortearPremio();
        }

        function avaliarBotaoSortearPremio() {
            const btn = document.getElementById('btn-sortear-premio');
            const entregues = getNumerosPremiosSorteados();
            const temDisponivel = bancoPremiacoes.some(p => !entregues.includes(p.numPremio));

            if (!temDisponivel) {
                btn.disabled = true;
                btn.innerText = "Todos os Prêmios Sorteados";
            } else {
                btn.disabled = false;
                btn.innerText = "Sortear Prêmio";
            }
        }

        function voltarParaSorteioPrincipal() {
            document.getElementById('tela-premios').style.display = 'none';
            document.getElementById('inicio').style.display = 'flex';
            document.getElementById('audio-aplausos').pause();
        }

        function obterDetalhesPremiosSorteados() {
            const salvos = localStorage.getItem('sorteio_premios_detalhes');
            return salvos ? JSON.parse(salvos) : [];
        }

        function getNumerosPremiosSorteados() {
            return obterDetalhesPremiosSorteados().map(p => p.numPremio);
        }

        function salvarPremioLocalStorage(numPremio, nomeVencedor, descPremio) {
            let entregues = obterDetalhesPremiosSorteados();
            entregues.push({
                numPremio: numPremio,
                nomeVencedor: nomeVencedor,
                descPremio: descPremio,
                data: new Date().toLocaleString()
            });
            localStorage.setItem('sorteio_premios_detalhes', JSON.stringify(entregues));
        }

        function iniciarSorteioPremio() {
            const entregues = getNumerosPremiosSorteados();
            const premiosDisponiveis = bancoPremiacoes.filter(p => !entregues.includes(p.numPremio));

            if (premiosDisponiveis.length === 0) return;

            document.getElementById('btn-sortear-premio').disabled = true;
            document.getElementById('resultado-premio').style.display = 'none';
            document.querySelectorAll('.numero-box-premio').forEach(el => el.classList.remove('vencedor', 'cursor'));

            const audioSus = document.getElementById('audio-suspense-premio');
            audioSus.currentTime = 0;
            audioSus.play();

            let tempoDecorrido = 0;
            const duracaoTotal = 6000; 
            const velocidadePulo = 100;
            
            const intervaloPremio = setInterval(() => {
                document.querySelectorAll('.numero-box-premio').forEach(el => el.classList.remove('cursor'));
                
                const aleatorioGeral = bancoPremiacoes[Math.floor(Math.random() * bancoPremiacoes.length)];
                const caixaAtual = document.getElementById('caixa-premio-' + aleatorioGeral.numPremio);
                if (caixaAtual) caixaAtual.classList.add('cursor');
                
                tempoDecorrido += velocidadePulo;
                if (tempoDecorrido >= duracaoTotal) {
                    clearInterval(intervaloPremio);
                    revelarPremio(premiosDisponiveis);
                }
            }, velocidadePulo);
        }

        function revelarPremio(disponiveis) {
            document.querySelectorAll('.numero-box-premio').forEach(el => el.classList.remove('cursor'));
            const premioVencedor = disponiveis[Math.floor(Math.random() * disponiveis.length)];
            const nomeDoGanhador = document.getElementById('nome-vencedor-premio').innerText;
            
            salvarPremioLocalStorage(premioVencedor.numPremio, nomeDoGanhador, premioVencedor.premio);

            const caixaVencedora = document.getElementById('caixa-premio-' + premioVencedor.numPremio);
            if (caixaVencedora) {
                caixaVencedora.classList.add('vencedor');
                setTimeout(() => caixaVencedora.classList.add('sorteado'), 3000);
            }

            document.getElementById('audio-suspense-premio').pause();
            const audioApla = document.getElementById('audio-aplausos');
            audioApla.currentTime = 0;
            audioApla.play();

            const resultadoArea = document.getElementById('resultado-premio');
            resultadoArea.style.display = 'block';

            document.getElementById('premio-topo').innerText = premioVencedor.topo;
            document.getElementById('premio-frase').innerText = premioVencedor.frase;

            const desc = document.getElementById('premio-descricao');
            desc.innerText = premioVencedor.premio;
            desc.className = premioVencedor.relevancia === 'dourado' ? 'premio-dourado-final' : 'premio-comum';

            dispararConfetes(premioVencedor.relevancia === 'dourado' ? 'ADMINISTRATIVO' : 'LEITURISTA');
            avaliarBotaoSortearPremio();

            setTimeout(() => {
                resultadoArea.scrollIntoView({ behavior: "smooth", block: "center" });
            }, 300);
        }

        // ======= MENUS DE HISTÓRICO E LIMPEZA (SORTEIO PRINCIPAL) =======
        function toggleMenu(id) {
            document.querySelectorAll('.select-flutuante').forEach(el => {
                if(el.id !== id) el.classList.remove('ativo');
            });
            document.getElementById(id).classList.toggle('ativo');
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.bloco-icone')) {
                document.querySelectorAll('.select-flutuante').forEach(el => el.classList.remove('ativo'));
            }
        });

        function obterChaveBanco(valorMenu) {
            if (!valorMenu) return "";
            let val = valorMenu.toLowerCase();
            if (val === "todos") return "Todos";
            if (val.includes("adm")) return "adm";
            if (val.includes("moto") || val.includes("rural") || val.includes("rurais")) return "moto";
            if (val.includes("pe") || val.includes("pedestre")) return "pe";
            return valorMenu; 
        }

        function verHistorico(valorMenu) {
            if(!valorMenu) return;
            document.getElementById('menu-hist').value = "";
            document.getElementById('menu-hist').classList.remove('ativo');

            let catBanco = obterChaveBanco(valorMenu);
            const historico = getHistorico();
            
            let filtrados = catBanco === "Todos" ? historico : historico.filter(h => h.categoria === catBanco);
            
            let nomeCat = catBanco === 'moto' ? 'Rurais' : catBanco === 'pe' ? 'Pedestres' : 'Administrativos';
            let html = `<h2>Categoria: ${catBanco === 'Todos' ? 'Todos' : nomeCat}</h2>`;
            
            if(filtrados.length === 0) {
                html += "<p style='text-align:center;'>Nenhum sorteio registrado para esta categoria.</p>";
            } else {
                filtrados.forEach(h => {
                    html += `<div class="hist-item"><b>Nº ${h.numSorte}</b> - ${h.nome} <br><small style="color:#aaa">${h.dataSorteio}</small></div>`;
                });
            }
            abrirModal(html);
        }

        let categoriaParaApagar = "";

        function apagarHistorico(valorMenu) {
            if(!valorMenu) return;
            
            document.getElementById('menu-clear').value = "";
            document.getElementById('menu-clear').classList.remove('ativo');

            categoriaParaApagar = obterChaveBanco(valorMenu);

            let nomeExibicao = categoriaParaApagar === 'moto' ? 'Leituristas Rurais' : categoriaParaApagar === 'pe' ? 'Leituristas Pedestres' : categoriaParaApagar === 'adm' ? 'Administrativos' : 'Todos';

            abrirModal(`
                <h2>⚠️ Atenção!</h2>
                <p style="text-align:center; font-size: 1.1rem;">
                    Tem certeza de que deseja apagar <span style='color:orange;'>permanentemente</span> o histórico da categoria <b><span style='color:lime;'>${nomeExibicao}</span></b>?
                </p>
                <div style="display: flex; justify-content: center; margin-top: 25px;">
                    <button onclick="executarLimpeza()" style="background: #ef4444; color: #fff; border: none; padding: 12px 25px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s;">
                        Sim, Apagar Permanentemente
                    </button>
                </div>
            `);
        }

        function executarLimpeza() {
            if(!categoriaParaApagar) return;
            const historico = getHistorico();
            
            if(categoriaParaApagar === "Todos") {
                historicoRef.set(null); 
                localStorage.removeItem('sorteio_premios_detalhes');
            } else {
                let historicoFiltrado = historico.filter(h => h.categoria !== categoriaParaApagar);
                
                if (historicoFiltrado.length === 0) {
                    historicoRef.set(null); 
                } else {
                    let novoObjetoFirebase = {};
                    historicoFiltrado.forEach((h, index) => {
                        let num = index + 1;
                        let chave = (num < 10 ? '0' + num : num) + 'º Sorteado';
                        novoObjetoFirebase[chave] = h;
                    });
                    historicoRef.set(novoObjetoFirebase);
                }
            }
            
            let nomeExibicao = categoriaParaApagar === 'moto' ? 'Leituristas Rurais' : categoriaParaApagar === 'pe' ? 'Leituristas Pedestres' : categoriaParaApagar === 'adm' ? 'Administrativos' : 'Todos';

            abrirModal(`
                <h2>Limpeza Concluída</h2>
                <p style="text-align:center">Os registros da categoria <span style='color:lime;'> <b>${nomeExibicao}</span></b> foram apagados com sucesso.</p>
            `);
            
            carregarLista(); 
            categoriaParaApagar = ""; 
        }

        // ======= FUNÇÕES DE PRÊMIOS (HISTÓRICO E RESET) =======
        
        function verHistoricoPremios() {
            const entregues = obterDetalhesPremiosSorteados();
            let html = `<h2>Histórico de Premiações</h2>`;
            
            if (entregues.length === 0) {
                html += "<p style='text-align:center;'>Nenhum prêmio sorteado ainda.</p>";
            } else {
                entregues.forEach(p => {
                    html += `
                    <div class="hist-item">
                        <span style="color:#aaa; font-size: 0.8rem; float:right;">${p.data.split(' ')[0]}</span>
                        <b>Prêmio ${p.numPremio}</b> - ${p.descPremio}<br>
                        <span style="color:#FFD700; font-size: 1.1rem; font-weight: bold; text-transform: uppercase;">🏆 ${p.nomeVencedor}</span>
                    </div>`;
                });
            }
            abrirModal(html);
        }

        function confirmarApagarPremios() {
            abrirModal(`
                <h2>⚠️ Resetar Prêmios!</h2>
                <p style="text-align:center; font-size: 1.1rem;">
                    Deseja resetar a lista de <b>prêmios sorteados</b>?<br><br>
                    <small style="color:#aaa;">Isso disponibilizará <span style='color:orange;'><b>todos os prêmios novamente</b></span> para sorteio, mas não apagará os vencedores.</small>
                </p>
                <div style="display: flex; justify-content: center; margin-top: 25px;">
                    <button onclick="executarLimpezaPremios()" style="background: #ef4444; color: #fff; border: none; padding: 12px 25px; font-weight: bold; border-radius: 5px; cursor: pointer;">
                        Sim, Resetar Prêmios
                    </button>
                </div>
            `);
        }

        function executarLimpezaPremios() {
            localStorage.removeItem('sorteio_premios_detalhes');
            renderizarGridPremios();
            abrirModal(`
                <h2>Prêmios Resetados</h2>
                <p style="text-align:center">A grade de prêmios está nova e pronta para o próximo evento.</p>
            `);
        }

        // ======= CONTROLE DO MODAL =======
        function abrirModal(conteudoHTML) {
            document.getElementById('modal-body').innerHTML = conteudoHTML;
            document.getElementById('modal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
